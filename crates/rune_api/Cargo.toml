[package]
name = "rune_api"
version = "0.1.0"
edition = "2024"

[dependencies]
http-body-util = "0.1.3"
hyper-rustls = "0.27.7"
hyper-util = { version = "0.1.16", features = ["client-legacy", "tokio"] }
hyper = { version = "1.6.0", features = ["http1", "client"] }
rune = "0.14.0"
rustls-native-certs = "0.8.1"
tokio = { version = "1.41.1", features = ["full"] }
